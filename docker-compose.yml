services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_BACKEND_TARGET: http://backend:8000
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '8000:8000'
    environment:
      OLLAMA_BASE_URL: 
      OLLAMA_MODEL: text2sql-local
      OLLAMA_KEEP_ALIVE: 10m
      T2S_PIPELINE: v2
      T2S_MODEL: qwen2.5-coder:14b-instruct
      DATABASE_URL:
      REDIS_URL: redis://redis:6379/0
      KURE_EMBEDDING_MODEL: nlpai-lab/KURE-v1
      VECTOR_CACHE_ENABLED: 1
      VECTOR_CACHE_THRESHOLD: 0.9
      VECTOR_CACHE_TTL_SECONDS: 86400
      QUERY_LOG_PATH: /app/backend-log.txt
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - backend_pip_cache:/root/.cache/pip
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  redis:
    image: redis/redis-stack-server:7.2.0-v10
    ports:
      - '6379:6379'

volumes:
  frontend_node_modules:
  backend_pip_cache:
